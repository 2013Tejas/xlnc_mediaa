<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="24" cy="24" r="24"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D5A6C"/>
      <stop offset="100%" stop-color="#1B2932"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#avatar-clip)">
    <!-- Background sky/coastal tone -->
    <rect width="48" height="48" fill="url(#bg-grad)"/>
    
    <!-- Torso with dark shirt -->
    <path d="M7 48C7 38 15 35 24 35C33 35 41 38 41 48Z" fill="#3B3A36"/>
    
    <!-- Neck -->
    <rect x="20" y="27" width="8" height="10" fill="#D39E82"/>
    
    <!-- Head -->
    <ellipse cx="24" cy="21" rx="10" ry="12" fill="#E2AC90"/>
    
    <!-- Hair -->
    <path d="M14 18C14 12 18 9 24 9C29 9 33 11 34 16C34 13 32 10 24 10C17 10 15 13 14 18Z" fill="#1C1815"/>
    <path d="M14 16C13 18 13 22 14 24C14.5 22 15 18 15 16Z" fill="#1C1815"/>
    <path d="M34 16C35 18 35 22 34 24C33.5 22 33 18 33 16Z" fill="#1C1815"/>
    
    <!-- Cool Sunglasses -->
    <path d="M16 19H22C23 19 23.5 20 23.5 21V23C23.5 24.5 22 25.5 20.5 25.5H17.5C16 25.5 15 24.5 15 23V21C15 20 15.5 19 16 19Z" fill="#111111"/>
    <path d="M26 19H32C32.5 19 33 20 33 21V23C33 24.5 32 25.5 30.5 25.5H27.5C26 25.5 24.5 24.5 24.5 23V21C24.5 20 25 19 26 19Z" fill="#111111"/>
    <!-- Sunglasses bridge -->
    <line x1="22.5" y1="21" x2="25.5" y2="21" stroke="#222222" stroke-width="2"/>
    <!-- Lens reflection -->
    <path d="M16.5 20.5L21.5 24.5" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
    <path d="M26.5 20.5L31.5 24.5" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>

    <!-- Subtle stubble / smile -->
    <path d="M21 29C22.5 30 25.5 30 27 29" stroke="#9A654C" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
